<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>You’re offline | A-Worthy</title>
<!--
  Served by the service worker (public/sw.js) when a page is requested with no
  network and no cached copy. Self-contained on purpose: the site stylesheet has
  a build hash in its name, so this page cannot rely on it. Colours mirror the
  LMS tokens in src/styles/global.css; the font is precached by the worker.
-->
<script>
  try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  @font-face {
    font-family: 'Nunito';
    font-style: normal;
    font-weight: 200 1000;
    font-display: swap;
    src: url('/fonts/nunito-latin-wght-normal.woff2') format('woff2');
  }
  :root {
    --bg: #FAF6EE; --card: #FFFFFF; --text: #1C1B19; --muted: #6B6760;
    --ink: #22304A; --ink-shadow: rgba(34, 48, 74, 0.14);
    --accent: #C0392B; --accent-press: #962D22; --accent-text: #C0392B;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171614; --card: #232220; --text: #F0EEE8; --muted: #B3AEA3;
      --ink: rgba(240, 238, 232, 0.26); --ink-shadow: rgba(0, 0, 0, 0.42); --accent-text: #E4796C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171614; --card: #232220; --text: #F0EEE8; --muted: #B3AEA3;
    --ink: rgba(240, 238, 232, 0.26); --ink-shadow: rgba(0, 0, 0, 0.42); --accent-text: #E4796C;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center;
    padding: max(1.5rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
    background: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, rgba(70, 50, 20, 0.03) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--text);
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.6;
  }
  .card {
    width: 100%; max-width: 440px; text-align: center;
    background: var(--card); border: 2px solid var(--ink); border-radius: 20px;
    box-shadow: 0 3px 0 var(--ink-shadow);
    padding: 2rem 1.5rem 1.75rem;
  }
  .logo { display: block; height: 104px; width: auto; margin: 0 auto 1rem; }
  .eyebrow {
    margin: 0 0 0.35rem; color: var(--muted);
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  }
  h1 { margin: 0 0 0.6rem; font-size: 1.75rem; font-weight: 900; letter-spacing: -0.02em; line-height: 1.2; }
  p { margin: 0 0 1.4rem; color: var(--muted); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 0.7rem 1.5rem;
    background: var(--accent); color: #fff;
    border: 2px solid var(--ink); border-radius: 999px;
    box-shadow: 0 4px 0 var(--accent-press);
    font: inherit; font-weight: 800; cursor: pointer;
  }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .call { display: block; margin-top: 1.25rem; font-size: 0.95rem; color: var(--muted); }
  .call a { color: var(--accent-text); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/images/logo-grade-a.webp" alt="" width="233" height="320" />
    <p class="eyebrow">No connection</p>
    <h1>You’re offline</h1>
    <p>Sorry, this page isn’t saved on your device yet. Check your connection, then try again.</p>
    <button type="button" class="btn" id="retry">Try again</button>
    <span class="call">Or call us on <a href="tel:+6589913181">+65 8991 3181</a></span>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
